[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-finder"
version = "0.1.0"
description = "Static call-graph and code coverage analyzer for finding untested active functions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
gap-finder = "gap_finder.cli:main"

[tool.setuptools.packages.find]
include = ["gap_finder*"]
